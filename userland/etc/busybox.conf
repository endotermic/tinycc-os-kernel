# /etc/busybox.conf - busybox's per-applet setuid rules (CONFIG_FEATURE_SUID_CONFIG).
# /bin/busybox is setuid root; the applets not named here keep the built-in rule (su,
# login and passwd keep root, the others drop it).  halt, poweroff and reboot run as root
# for every user, so that JWM's "Shut down" and "Reboot" work in an xdm session: they
# signal PID 1 (userland/busybox-init.c), which stops everything and calls reboot(2).
# Mode: owner, group, other; s = setuid/setgid and executable, x = executable.
[SUID]
halt = ssx root.0
poweroff = ssx root.0
reboot = ssx root.0
