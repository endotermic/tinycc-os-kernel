<!DOCTYPE html>
<!-- SPDX-License-Identifier: BSD-2-Clause -->
<html><head><title>es</title><script src="harness.js"></script></head><body>
<p id="out">not run</p><ul id="list"></ul>
<script>
// the language (QuickJS, ES2023 and later) as the page sees it
class Shape { #id = 7; constructor(n) { this.n = n; } get id() { return this.#id; } static make(n) { return new Shape(n); } }
T.eq("class private field", Shape.make("s").id, 7);
const f = (a, b = 2, ...rest) => a * b + rest.length;
T.eq("arrow default rest", f(3, undefined, 9, 9), 8);
const { x, y: [y1] } = { x: 1, y: [5] };
T.eq("destructuring", "" + x + y1, "15");
T.eq("Map", new Map([[1, "a"]]).get(1), "a");
T.eq("Set", new Set([1, 1, 2]).size, 2);
T.eq("optional chaining", ({ a: { b: 3 } })?.a?.b ?? 0, 3);
T.eq("nullish", null?.z ?? "dflt", "dflt");
T.eq("BigInt", (2n ** 70n).toString(), "1180591620717411303424");
T.eq("flat", [1, [2, [3]]].flat(9).join(""), "123");
T.eq("Object.groupBy", JSON.stringify(Object.groupBy([1, 2, 3], v => v % 2 ? "o" : "e")), '{"o":[1,3],"e":[2]}');
T.eq("Array.prototype.at", [1, 2, 3].at(-1), 3);
T.eq("String.replaceAll", "a.b.c".replaceAll(".", "-"), "a-b-c");
T.eq("regexp named groups", /(?<y>\d{4})/.exec("in 2026").groups.y, "2026");
T.eq("JSON", JSON.stringify({ a: [1, 2.5, "x"], b: null }), '{"a":[1,2.5,"x"],"b":null}');
T.eq("number formatting", Math.sqrt(2).toFixed(6) + "," + (0.1 + 0.2) + "," + 1e21, "1.414214,0.30000000000000004,1e+21");
T.eq("Date", new Date(0).toISOString(), "1970-01-01T00:00:00.000Z");
T.eq("window is the global", window === globalThis, true);
T.eq("typeof document", typeof document, "object");
try { null.x; T.ok("TypeError thrown", false); } catch (e) { T.eq("TypeError thrown", e.constructor.name, "TypeError"); }
// the DOM from script
const p = document.getElementById("out"), ul = document.getElementById("list");
p.textContent = "run";
for (const w of ["alpha", "beta"]) { const li = document.createElement("li"); li.textContent = w; ul.appendChild(li); }
T.eq("appendChild", ul.childNodes.length, 2);
T.todo("Element.tagName", p.tagName, "P"); // phase 1
T.eq("nodeName", p.nodeName, "P");
T.eq("textContent", p.textContent, "run");
// microtasks run before timers
const order = [];
setTimeout(() => {
    order.push("timer");
    T.eq("microtasks before timers", order.join(","), "promise,async,timer");
    T.done();
}, 10);
Promise.resolve(41).then(v => order.push(v === 41 ? "promise" : "bad"));
(async () => { await null; order.push("async"); })();
</script></body></html>
