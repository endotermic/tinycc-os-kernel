<!DOCTYPE html>

<html><head><title>style</title><script src="harness.js"></script>
<style>
.narrow { width: 50px; } .wide { width: 120px; }
#w { width: 100px; height: 40px; padding: 5px; border: 2px solid black; color: rgb(0, 0, 255); }
.gone { display: none; }
#fx-wrap { position: absolute; top: 300px; left: 0; width: 200px; }
#fx { position: fixed; top: 0; right: 0; width: 30px; }
#fx div { height: 20px; }
#fx-next { margin-top: 56px; height: 5px; }
:where(.iw-a) { width: 24px; height: 5px; }
section span { display: block; height: 5px; }
section :is(.iw-b, .iw-c) span { width: 31px; }
:is(.iw-d:is(.iw-e)) { width: 17px; height: 5px; }
.iw-f:-webkit-any(.iw-g) { width: 13px; height: 5px; }
.fx-host { display: flex; height: 40px; width: 300px; }
.fx-wrap { width: 100%; }
.fx-cont { display: flex; height: 100%; }
.fx-cont button { width: 64px; margin: 0; border: 1px solid; padding: 0; }
.ifx { display: inline-flex; width: 30px; height: 20px; padding: 10px 0; }
</style></head><body>
<div id="w">w</div><div id="g" class="gone">g</div><span id="sp">sp</span>
<div class="iw-a" id="iw1"></div><section><div class="iw-b"><span id="iw2"></span></div><div class="iw-c"><span id="iw3"></span></div><div><span id="iw4"></span></div></section>
<div class="iw-d iw-e" id="iw5"></div><div class="iw-d" id="iw6" style="height:5px"></div><div class="iw-f iw-g" id="iw7"></div>
<div class="fx-host"><div class="fx-wrap"><div class="fx-cont" id="fx-cont"><span id="fx-span">s</span><button id="fx-btn">B</button></div></div></div>
<div id="ifx-line" style="width: 200px"><span><span class="ifx">i</span></span></div>
<div id="fx-wrap"><div><div id="fx"><div></div></div><div id="fx-next"></div></div></div>
<script>
// inline style, computed style, geometry, matchMedia (webapi.js + Window.bnd natives)
const w = document.getElementById("w"), g = document.getElementById("g");
w.style.backgroundColor = "red";
T.eq("style set", w.getAttribute("style"), "background-color: red;");
T.eq("style get", w.style.backgroundColor, "red");
w.style.setProperty("margin-top", "3px", "important");
T.eq("setProperty important", w.style.cssText, "background-color: red; margin-top: 3px !important;");
T.eq("getPropertyPriority", w.style.getPropertyPriority("margin-top"), "important");
w.style.removeProperty("margin-top");
w.style.cssFloat = "left";
T.eq("cssFloat", w.style.getPropertyValue("float"), "left");
w.style.cssText = "color: green";
T.eq("cssText set", w.style.color + "," + w.style.length, "green,1");
w.style.color = "";
T.eq("empty value removes", w.hasAttribute("style"), false);
T.eq("unsupported property", ("transition" in w.style) + "," + typeof w.style.transition, "false,undefined");
T.eq("supported property", ("display" in w.style) + "," + w.style.display, "true,");
T.eq("same object", w.style, w.style);
T.eq("innerWidth", window.innerWidth > 0, true);
T.eq("matchMedia", [matchMedia("(min-width: 1px)").matches, matchMedia("(max-width: 1px)").matches,
    matchMedia("print").matches, matchMedia("screen and (orientation: landscape)").matches].join(), "true,false,false,true");
window.addEventListener("load", () => setTimeout(async () => {
    const r = w.getBoundingClientRect();
    T.eq("getBoundingClientRect", r.width + "x" + r.height, "114x54");
    T.eq("offsetWidth/Height", w.offsetWidth + "x" + w.offsetHeight, "114x54");
    T.eq("clientWidth", w.clientWidth, 110);
    T.ok("rect position", r.left >= 0 && r.top >= 0 && r.right === r.left + 114);
    const cs = getComputedStyle(w);
    T.eq("computed display", cs.display, "block");
    T.eq("computed color", cs.color, "rgb(0, 0, 255)");
    T.eq("computed getPropertyValue", cs.getPropertyValue("width"), "100px");
    T.eq("computed display none", getComputedStyle(g).display, "none");
    T.eq("computed inline", getComputedStyle(document.getElementById("sp")).display, "inline");
    T.eq("no box", g.getBoundingClientRect().width + "," + g.offsetWidth, "0,0");
    // SVG elements have style too (YouTube's icons; el.style = "..." made a string)
    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    T.eq("svg element style", typeof svg.style, "object");
    svg.style = "fill: red";
    T.eq("svg style set as a string", svg.style.fill, "red");
    svg.style.cssText = "";
    T.eq("svg style cssText cleared", svg.getAttribute("style"), null);
    T.eq("same style object", document.body.style, document.body.style);
    T.ok("style own on HTMLElement.prototype", Object.prototype.hasOwnProperty.call(HTMLElement.prototype, "style"));
    // as in browsers style is not on Element.prototype (YouTube's components shadow everything named
    // there with a setter-only accessor) but on SVGElement.prototype, and SVG elements are SVGElements
    T.eq("style not own on Element.prototype", Object.prototype.hasOwnProperty.call(Element.prototype, "style"), false);
    T.eq("SVG element is an SVGElement", [svg instanceof SVGElement, svg instanceof Element,
        Object.getPrototypeOf(SVGElement.prototype) === Element.prototype,
        Object.prototype.hasOwnProperty.call(SVGElement.prototype, "style")].join(","), "true,true,true,true");
    // a changed class attribute restyles (libdom kept the first class list for selectors)
    const cls = document.createElement("div");
    cls.className = "narrow";
    document.body.appendChild(cls);
    await new Promise(r => setTimeout(r, 300));
    const w1 = cls.getBoundingClientRect().width;
    cls.className = "narrow wide";
    await new Promise(r => setTimeout(r, 600));
    T.eq("class change restyles", w1 + "->" + cls.getBoundingClientRect().width, "50->120");
    cls.classList.remove("wide");
    await new Promise(r => setTimeout(r, 600));
    T.eq("classList change restyles", cls.getBoundingClientRect().width, 50);
    const inh = document.createElement("span");
    inh.setAttribute("style", "visibility: inherit");
    document.body.appendChild(inh);
    await new Promise(r => setTimeout(r, 300));
    T.eq("computed visibility of an inline inherit", getComputedStyle(inh).visibility, "visible");
    // :is() and :where() (and :-webkit-any()), expanded by libcss into plain selectors
    const iw = id => Math.round(document.getElementById(id).getBoundingClientRect().width);
    T.eq(":where()", iw("iw1"), 24);
    T.eq(":is() with a list, between combinators", [iw("iw2"), iw("iw3"), iw("iw4") > 31].join(","), "31,31,true");
    T.eq("nested :is()", [iw("iw5"), iw("iw6") > 17].join(","), "17,true");
    T.eq(":-webkit-any()", iw("iw7"), 13);
    // flex: a stretched item's height is definite for percentages inside it; spans and buttons among
    // the items are blockified and stretch (YouTube's search button was 16px in a 40px bar)
    const fh = id => Math.round(document.getElementById(id).getBoundingClientRect().height);
    T.eq("height: 100% in a stretched flex item", fh("fx-cont"), 40);
    T.eq("span and button flex items stretch", fh("fx-span") + "," + fh("fx-btn"), "40,40");
    // an inline-flex box makes its line as tall as it is (the line was 0px: YouTube's logo fell out of the masthead)
    T.eq("line with an inline-flex box", fh("ifx-line"), 40);
    // a fixed box before a block with a top margin: the margin is not lost inside it
    T.eq("margin after a fixed sibling", Math.round(document.getElementById("fx-next").getBoundingClientRect().top), 356);
    // <style> elements made by scripts (text set before or after insertion) apply
    const dyn = ["a", "b", "c"].map(() => { const d = document.createElement("div"); d.style.height = "5px"; document.body.appendChild(d); return d; });
    dyn.forEach((d, i) => d.id = "dyn" + i);
    const s1 = document.createElement("style");
    s1.textContent = "#dyn0 { width: 11px; }";
    document.head.appendChild(s1);
    const s2 = document.createElement("style");
    document.head.appendChild(s2);
    s2.textContent = "#dyn1 { width: 22px; }";
    const s3 = document.createElement("style");
    s3.appendChild(document.createTextNode("#dyn2 { width: 33px; }"));
    document.body.appendChild(s3);
    await new Promise(r => setTimeout(r, 800));
    T.eq("style elements added by a script", dyn.map(d => d.getBoundingClientRect().width).join(","), "11,22,33");
    // mask-image and the mask shorthands are kept by libcss (drawing: page mask)
    T.eq("CSS.supports mask", [CSS.supports("mask", "url(i.svg) no-repeat center / cover"),
        CSS.supports("-webkit-mask", "url(i.svg) no-repeat"), CSS.supports("mask-image", "url(i.svg)"),
        CSS.supports("-webkit-mask-image", "none"), CSS.supports("mask-image", "12px")].join(","), "true,true,true,true,false");
    T.done();
}, 100));
</script></body></html>
